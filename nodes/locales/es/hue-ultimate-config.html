## Documentación

Los nodos funcionan directamente con mensajes Node-RED: `msg.topic` identifica la función y `msg.payload` contiene su valor. KNX Ultimate no es necesario.

Crea la configuración desde el selector Hue Bridge del Controller. Busca el bridge o introduce su IP, pulsa **CONNECT** y después el botón físico del bridge. Guarda y pulsa Deploy. Puedes reutilizar las credenciales existentes. Varios Controllers pueden compartir el mismo bridge.

Activa los pines de entrada/salida e introduce nombres de topics en los campos de comando y estado. Deja vacío el gateway KNX; los campos DPT se ocultan porque no son necesarios. Usa topics distintos para comandos y estados. La coincidencia debe ser exacta; no se admiten comodines.

### Modo KNX

**También puedes usar este paquete con KNX Ultimate.** La integración es nativa: instala `node-red-contrib-knx-ultimate` y selecciona su gateway para activar el **Modo KNX**. Los mismos campos usan entonces direcciones de grupo y DPT, con sugerencias del proyecto ETS importado. Comandos y estados pasan directamente por el bus; no hacen falta nodos Function intermedios para estas asignaciones.

Al seleccionar un gateway, sustituye los topics guardados por direcciones de grupo reales y elige los DPT correctos. Si el gateway seleccionado está desconectado, el nodo permanece en Modo KNX. Para volver a los mensajes Node-RED, quita la selección del gateway y configura de nuevo los topics.

[Nodos](https://supergiovane.github.io/node-red-contrib-hue-ultimate/es/nodes.html) · [Ejemplos](https://supergiovane.github.io/node-red-contrib-hue-ultimate/es/examples.html)

Este nodo registra Node-RED en el puente Hue y ahora realiza automáticamente el proceso de emparejamiento.

Introduce la IP del puente (o elige una de las detectadas automáticamente) y pulsa **CONNECT**. El editor seguirá consultando el puente y cerrará la ventana de espera en cuanto pulses el botón físico de enlace. Usa **CANCEL** si necesitas cancelar la espera y probar más tarde. Los campos de Nombre de usuario y Client Key permanecen editables para que puedas copiar o pegar las credenciales en cualquier momento.

¿Ya tienes las credenciales? Haz clic en **YA TENGO LAS CREDENCIALES** para mostrar los campos al instante e introducirlas manualmente sin esperar al botón del puente.

**General**

| Propiedad | Descripción |
|-|-|
| IP | Introduce la IP fija de tu puente Hue o selecciona uno de los puentes detectados automáticamente. |
| CONECTAR | Inicia el registro y espera al botón de enlace del puente. La ventana se cierra automáticamente cuando lo pulsas; utiliza **CANCEL** para detener la espera. |
| Nombre | Nombre del puente leído desde la Hue Bridge después de una conexión correcta. |
| Nombre de usuario | Nombre de usuario devuelto por la Hue Bridge tras el emparejamiento. El campo permanece editable para poder copiar, pegar o escribir el valor manualmente. |
| Clave del cliente | Clave del cliente devuelta por la Hue Bridge tras el emparejamiento. El campo permanece editable para poder copiar, pegar o escribir el valor manualmente. |
