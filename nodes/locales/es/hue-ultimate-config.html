## Hue Bridge

Este nodo de configuración conecta HUE Ultimate con un Philips Hue Bridge. Varios HUE Controllers pueden compartir la misma configuración.

### Emparejar un bridge

1. Introduce la dirección IP fija o selecciona un bridge detectado en la red local.
2. Pulsa **CONECTAR** y después el botón físico de enlace del bridge.
3. Espera a que finalice el registro, guarda la configuración y pulsa Deploy.

Usa **CANCEL** para detener la espera sin cambiar las credenciales guardadas.

### Credenciales existentes

Pulsa **YA TENGO LAS CREDENCIALES** para introducir manualmente el nombre de usuario y la clave del cliente. Ambos campos siguen siendo editables, por lo que puedes reutilizar las credenciales de una instalación existente sin volver a emparejar.

### Propiedades

| Propiedad | Descripción |
|--|--|
| IP | Dirección fija del Hue Bridge. El botón de actualización repite la detección local. |
| Nombre | Nombre descriptivo leído después de una conexión correcta. |
| ID del bridge | Identificador estable indicado por el bridge. |
| Nombre de usuario | Usuario de aplicación obtenido durante el emparejamiento o introducido manualmente. |
| Clave del cliente | Clave de aplicación obtenida durante el emparejamiento o introducida manualmente. |

[Documentación de HUE Controller](https://supergiovane.github.io/node-red-contrib-hue-ultimate/es/nodes.html)
