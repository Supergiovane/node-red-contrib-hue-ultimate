## Hue Bridge

Questo nodo di configurazione collega HUE Ultimate a un Philips Hue Bridge. Più HUE Controller possono condividere la stessa configurazione.

### Associa un bridge

1. Inserisci l’indirizzo IP fisso oppure seleziona un bridge rilevato nella rete locale.
2. Premi **CONNETTI**, quindi il pulsante fisico di collegamento sul bridge.
3. Attendi il completamento della registrazione, salva la configurazione e fai Deploy.

Usa **CANCEL** per interrompere l’attesa senza modificare le credenziali salvate.

### Credenziali esistenti

Premi **HO GIÀ LE CREDENZIALI** per inserire manualmente Username e Client Key. Entrambi i campi restano modificabili, quindi puoi riutilizzare le credenziali di un’installazione esistente senza ripetere l’associazione.

### Proprietà

| Proprietà | Descrizione |
|--|--|
| IP | Indirizzo fisso di Hue Bridge. Il pulsante di aggiornamento ripete la ricerca locale. |
| Nome | Nome descrittivo letto dopo una connessione riuscita. |
| ID bridge | Identificatore stabile indicato dal bridge. |
| Username | Nome utente dell’applicazione restituito durante l’associazione o inserito manualmente. |
| Client Key | Chiave client dell’applicazione restituita durante l’associazione o inserita manualmente. |

[Documentazione di HUE Controller](https://supergiovane.github.io/node-red-contrib-hue-ultimate/it/nodes.html)
