## Documentazione

I nodi lavorano direttamente con i messaggi Node-RED: `msg.topic` identifica la funzione e `msg.payload` contiene il valore. KNX Ultimate non è necessario.

Crea la configurazione dal selettore Hue Bridge del Controller. Cerca il bridge o inserisci il suo IP, premi **CONNECT**, poi il pulsante fisico sul bridge. Salva e fai Deploy. Puoi riutilizzare credenziali esistenti invece di ripetere l’abbinamento. Più Controller possono condividere lo stesso bridge.

Abilita i pin di ingresso/uscita e inserisci i nomi dei topic nei campi di comando e stato. Lascia vuoto il gateway KNX; i campi DPT sono nascosti perché non servono. Usa topic distinti per comandi e stati. Il topic deve corrispondere esattamente: non sono supportati caratteri jolly.

### Modalità KNX

**Puoi usare il package anche con KNX Ultimate.** L’integrazione è nativa: installa `node-red-contrib-knx-ultimate` e seleziona il suo gateway per attivare la **Modalità KNX**. Gli stessi campi di mappatura usano quindi indirizzi di gruppo e DPT, con suggerimenti dal progetto ETS importato. Comandi e stati passano direttamente sul bus; per queste mappature non servono nodi Function intermedi.

Quando selezioni un gateway, sostituisci i topic salvati con indirizzi di gruppo reali e scegli i DPT corretti. Un gateway selezionato ma offline mantiene il nodo in Modalità KNX. Per tornare ai messaggi Node-RED, svuota il gateway e configura nuovamente i topic.

Questo nodo registra Node-RED presso l'Hue Bridge e ora gestisce automaticamente la procedura di abbinamento.

Inserisci l'IP del bridge (o scegli uno tra quelli individuati automaticamente) e premi **CONNECT**. L'editor continua a interrogare il bridge e chiude la finestra di attesa non appena premi il pulsante fisico di collegamento. Usa **CANCEL** se vuoi interrompere l'attesa e riprovare più tardi. I campi Username e Client Key restano sempre modificabili in modo da poter copiare o incollare le credenziali quando serve.

Hai già le credenziali? Fai clic su **HO GIÀ LE CREDENZIALI** per mostrare subito i campi e inserirle manualmente senza attendere il pulsante del bridge.

**Generale**

| Proprietà | Descrizione |
|--|--|
| IP | Inserisci l'IP fisso del tuo bridge Hue oppure seleziona uno tra quelli scoperti automaticamente. |
| CONNETTI | Avvia la registrazione e attende il pulsante di collegamento del bridge. La finestra si chiude automaticamente quando premi il pulsante; usa **CANCEL** per interrompere l'attesa. |
| Nome | Nome del bridge letto dal bridge Hue dopo una connessione riuscita. |
| Username | Username restituito dal bridge Hue dopo l'abbinamento. Il campo resta modificabile per consentire copia/incolla o l'inserimento manuale. |
| Client Key | Client Key restituita dal bridge Hue dopo l'abbinamento. Il campo resta modificabile per consentire copia/incolla o l'inserimento manuale. |
