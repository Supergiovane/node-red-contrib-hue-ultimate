## HUE Controller

HUE Controller collega le risorse Philips Hue API v2 direttamente a Node-RED. Funziona come nodo autonomo: msg.topic seleziona una funzione configurata e msg.payload contiene il valore del comando o dello stato.

[Tutorial video di HUE Ultimate](https://www.youtube.com/playlist?list=PL9Yh1bjbLAYrU8PsVhW4xzEug2WtVFv3E)

## Avvio rapido

1. Configura un Hue Bridge e aggiungi HUE Controller al flow.
2. Seleziona una risorsa Hue. La funzione e le capacità disponibili vengono rilevate automaticamente.
3. Lascia l’integrazione opzionale su none per un flow basato soltanto sui messaggi.
4. Abilita i pin di ingresso/uscita, assegna topic esatti a comandi e stati, quindi premi Deploy.

## Mappature dei messaggi Node-RED (predefinite)

Ogni campo di comando o stato è una mappatura. Nella modalità predefinita inserisci un nome di topic. I topic di comando leggono msg.payload; quelli di stato pubblicano msg.payload. La corrispondenza del topic è esatta e i caratteri jolly non sono supportati.

```js
msg.topic = 'living-room/brightness'
msg.payload = 60
return msg
```

Usa valori booleani per acceso/spento, percentuali per la luminosità, Kelvin per la temperatura colore e un oggetto con le proprietà red, green e blue per RGB. La dimmerazione relativa usa un oggetto con decr_incr e data. Il richiamo scena accetta il numero configurato oppure un booleano per una singola scena.

### Messaggi di input Philips Hue API v2

Per le funzioni dispositivo dotate di pin di ingresso puoi anche inviare un comando nativo Philips Hue API v2, senza usare una mappatura topic/payload. Inserisci le proprietà API direttamente in msg, non dentro msg.payload. Per esempio, per accendere una luce:

```js
msg = { on: { on: true } }
return msg
```

Invia soltanto proprietà supportate dalla risorsa Hue selezionata. Il comando nativo viene inoltrato a Hue così come fornito.

## Integrazione KNX opzionale

Seleziona un gateway KNX Ultimate soltanto quando il flow deve scambiare telegrammi con indirizzi di gruppo. I campi di mappatura accettano quindi indirizzi di gruppo o nomi ETS e mostrano il selettore DPT applicabile. Svuota l’integrazione opzionale per tornare ai topic Node-RED; i flow basati sui messaggi non richiedono alcun package o gateway KNX.

## Comportamento dell’editor e diagnostica

- Le mappature salvate vengono mostrate subito, anche mentre è ancora in caricamento il catalogo delle risorse di Hue Bridge.
- Per le luci, Dim, Tunable White, RGB/HSV ed effetti nativi seguono le capacità live <code>dimming</code>, <code>color_temperature</code>, <code>color</code> ed effects.
- Un errore nella richiesta delle capacità non cancella mai la configurazione salvata. Node-RED mostra un errore chiudibile e mantiene utilizzabile l’editor.
- Il cambio della risorsa selezionata è soltanto un’anteprima fino al salvataggio. Annulla ripristina risorsa, funzione e mappature precedenti.

## Conversione dei nodi HUE legacy

Quando sono presenti nodi HUE legacy, la conversione scarica prima un backup locale dei flow. Conserva ID dei nodi, riferimenti alle configurazioni, posizioni e collegamenti, poi lascia il risultato non distribuito per il controllo. Esamina ogni nodo convertito prima di premere Deploy.

[Guarda il video sulla conversione dei nodi HUE legacy](https://youtu.be/f0Evf2QFI7c)
