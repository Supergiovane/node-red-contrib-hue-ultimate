## Hue Bridge

此配置节点用于将 HUE Ultimate 连接到 Philips Hue Bridge。多个 HUE Controller 可以共享同一配置。

### 配对网桥

1. 输入固定 IP 地址，或选择在本地网络中发现的网桥。
2. 点击 **连接**，然后按下网桥上的实体配对按钮。
3. 等待注册完成，保存配置并点击 Deploy。

使用 **CANCEL** 可以停止等待，而不会修改已保存的凭据。

### 使用现有凭据

点击 **我已有凭据**，手动输入用户名和客户端密钥。两个字段始终可编辑，因此可以复用现有安装的凭据，无需重新配对。

### 属性

| 属性 | 说明 |
|--|--|
| IP | Hue Bridge 的固定地址。刷新按钮会重新执行本地发现。 |
| 名称 | 成功连接后读取的网桥显示名称。 |
| 网桥 ID | 网桥报告的稳定标识符。 |
| 用户名 | 配对时返回或手动输入的应用程序用户名。 |
| 客户端密钥 | 配对时返回或手动输入的应用程序客户端密钥。 |

[HUE Controller 文档](https://supergiovane.github.io/node-red-contrib-hue-ultimate/zh-CN/nodes.html)
