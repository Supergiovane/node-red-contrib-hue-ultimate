## Hue Bridge

Ce nœud de configuration relie HUE Ultimate à un Philips Hue Bridge. Plusieurs HUE Controllers peuvent partager la même configuration.

### Associer un bridge

1. Saisissez l’adresse IP fixe ou sélectionnez un bridge détecté sur le réseau local.
2. Cliquez sur **CONNECTER**, puis appuyez sur le bouton physique de liaison du bridge.
3. Attendez la fin de l’enregistrement, sauvegardez la configuration et faites Deploy.

Utilisez **CANCEL** pour interrompre l’attente sans modifier les identifiants enregistrés.

### Identifiants existants

Cliquez sur **JE POSSÈDE DÉJÀ LES IDENTIFIANTS** pour saisir manuellement le nom d’utilisateur et la clé client. Les deux champs restent modifiables afin de réutiliser les identifiants d’une installation existante sans nouvel appairage.

### Propriétés

| Propriété | Description |
|--|--|
| IP | Adresse fixe du Hue Bridge. Le bouton d’actualisation relance la détection locale. |
| Nom | Nom lisible obtenu après une connexion réussie. |
| ID du bridge | Identifiant stable signalé par le bridge. |
| Nom d’utilisateur | Identifiant d’application obtenu pendant l’appairage ou saisi manuellement. |
| Clé client | Clé d’application obtenue pendant l’appairage ou saisie manuellement. |

[Documentation de HUE Controller](https://supergiovane.github.io/node-red-contrib-hue-ultimate/fr/nodes.html)
