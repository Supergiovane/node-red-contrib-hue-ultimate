## HUE Controller

HUE Controller relie directement les ressources Philips Hue API v2 à Node-RED. Il fonctionne de façon autonome : msg.topic sélectionne une fonction configurée et msg.payload transporte la valeur de commande ou d’état.

[Tutoriels vidéo HUE Ultimate](https://www.youtube.com/playlist?list=PL9Yh1bjbLAYrU8PsVhW4xzEug2WtVFv3E)

## Démarrage rapide

1. Configurez un Hue Bridge et ajoutez HUE Controller au flow.
2. Sélectionnez une ressource Hue. Sa fonction et ses capacités disponibles sont détectées automatiquement.
3. Laissez l’intégration facultative sur none pour un flow uniquement basé sur les messages.
4. Activez les entrées/sorties, attribuez des topics exacts aux commandes et états, puis faites Deploy.

## Correspondances des messages Node-RED (par défaut)

Chaque champ de commande ou d’état est une correspondance. En mode par défaut, saisissez un nom de topic. Les topics de commande lisent msg.payload ; les topics d’état publient msg.payload. La correspondance est exacte et les caractères génériques ne sont pas pris en charge.

```js
msg.topic = 'living-room/brightness'
msg.payload = 60
return msg
```

Utilisez des booléens pour marche/arrêt, des pourcentages pour la luminosité, des Kelvin pour la température de couleur et un objet avec les propriétés red, green et blue pour RGB. La variation relative utilise un objet avec decr_incr et data. Le rappel de scène accepte le numéro configuré ou un booléen pour une scène unique.

### Messages d’entrée Philips Hue API v2

Pour les fonctions disposant d’une entrée, vous pouvez aussi envoyer une commande native Philips Hue API v2 au lieu d’utiliser une correspondance topic/payload. Placez les propriétés API directement dans msg, et non dans msg.payload. Par exemple, pour allumer une lumière :

```js
msg = { on: { on: true } }
return msg
```

Envoyez uniquement les propriétés prises en charge par la ressource Hue sélectionnée. La commande native est transmise à Hue telle quelle.

## Intégration KNX facultative

Sélectionnez une passerelle KNX Ultimate uniquement si le flow doit échanger des télégrammes d’adresses de groupe. Les champs acceptent alors des adresses de groupe ou des noms ETS et affichent le sélecteur DPT applicable. Effacez l’intégration facultative pour revenir aux topics Node-RED ; les flows basés sur les messages ne nécessitent aucun package ni passerelle KNX.

## Comportement de l’éditeur et diagnostic

- Les mappages enregistrés s’affichent immédiatement, même pendant le chargement du catalogue de ressources du Hue Bridge.
- Pour les lumières, Dim, Tunable White, RGB/HSV et les effets natifs suivent les capacités actives <code>dimming</code>, <code>color_temperature</code>, <code>color</code> et effects.
- L’échec d’une requête de capacités n’efface jamais la configuration enregistrée. Node-RED affiche une erreur refermable et l’éditeur reste utilisable.
- Le changement de ressource reste un aperçu jusqu’à l’enregistrement. Annuler restaure la ressource, la fonction et les correspondances précédentes.

## Conversion des anciens nœuds HUE

Lorsque des nœuds HUE legacy sont présents, la conversion télécharge d’abord une sauvegarde locale des flows. Elle conserve les identifiants, références de configuration, positions et câblages, puis laisse le résultat non déployé pour vérification. Contrôlez chaque nœud converti avant Deploy.

[Voir la vidéo de conversion des anciens nœuds HUE](https://youtu.be/f0Evf2QFI7c)

<span id="hue-controller-help-light" data-hue-controller-type="light"></span>

### Lampe / groupe de lampes (`light`)

Contrôle une lumière ou un groupe : marche/arrêt, luminosité relative et absolue, température de couleur, RGB/HSV, effets et comportement jour/nuit.

<span id="hue-controller-help-plug" data-hue-controller-type="plug"></span>

### Prise / sortie (`plug`)

Contrôle une prise Hue et publie son état marche/arrêt ainsi que son état d’alimentation signalé.

<span id="hue-controller-help-button" data-hue-controller-type="button"></span>

### Bouton (`button`)

Publie les appuis courts, longs et répétés et peut les associer à des commandes de commutation ou de variation.

<span id="hue-controller-help-relative_rotary" data-hue-controller-type="relative_rotary"></span>

### Tap dial (`relative_rotary`)

Publie les rotations du Tap dial pour le contrôle relatif ou absolu d’un niveau.

<span id="hue-controller-help-motion" data-hue-controller-type="motion"></span>

### Mouvement (`motion`)

Publie l’état détecté/non détecté d’un capteur de mouvement Hue.

<span id="hue-controller-help-area_motion" data-hue-controller-type="area_motion"></span>

### Mouvement de zone (`area_motion`)

Publie l’état de mouvement agrégé signalé par une zone MotionAware.

<span id="hue-controller-help-camera_motion" data-hue-controller-type="camera_motion"></span>

### Mouvement de caméra (`camera_motion`)

Publie l’état de mouvement signalé par une ressource caméra Hue compatible.

<span id="hue-controller-help-contact" data-hue-controller-type="contact"></span>

### Contact (`contact`)

Publie l’état ouvert/fermé d’un capteur de contact Hue.

<span id="hue-controller-help-light_level" data-hue-controller-type="light_level"></span>

### Niveau de lumière (`light_level`)

Publie l’éclairement ambiant en lux.

<span id="hue-controller-help-temperature" data-hue-controller-type="temperature"></span>

### Température (`temperature`)

Publie la température mesurée en degrés Celsius.

<span id="hue-controller-help-humidity" data-hue-controller-type="humidity"></span>

Publie l’humidité relative en pourcentage.

<span id="hue-controller-help-scene" data-hue-controller-type="scene"></span>

<span id="hue-controller-help-device_power" data-hue-controller-type="device_power"></span>
