## Hue Bridge

This configuration node connects HUE Ultimate to a Philips Hue Bridge. Multiple HUE Controllers can share the same configuration.

### Pair a bridge

1. Enter the fixed IP address or select a bridge discovered on the local network.
2. Click **CONNECT**, then press the physical link button on the bridge.
3. Wait for the editor to complete registration, save the configuration and Deploy.

Use **CANCEL** to stop waiting without changing the saved credentials.

### Existing credentials

Click **I ALREADY HAVE THE CREDENTIALS** to enter a Username and Client Key manually. Both fields remain editable, so credentials from an existing installation can be reused without pairing again.

### Properties

| Property | Description |
|--|--|
| IP | Fixed address of the Hue Bridge. The refresh button repeats local discovery. |
| Name | Friendly bridge name read after a successful connection. |
| Bridge ID | Stable identifier reported by the bridge. |
| Username | Application username returned during pairing or entered manually. |
| Client Key | Application client key returned during pairing or entered manually. |

[HUE Controller documentation](https://supergiovane.github.io/node-red-contrib-hue-ultimate/en/nodes.html)
