## HUE Controller

HUE Controller connects Philips Hue API v2 resources directly to Node-RED. It works as a standalone node: msg.topic selects a configured function and msg.payload carries the command or state value.

[HUE Ultimate video tutorials](https://www.youtube.com/playlist?list=PL9Yh1bjbLAYrU8PsVhW4xzEug2WtVFv3E)

## Quick start

1. Configure a Hue Bridge and add HUE Controller to the flow.
2. Select a Hue resource. Its function and available capabilities are detected automatically.
3. Leave the optional integration at none for a message-only flow.
4. Enable the input/output pins, assign exact command and state topics, then Deploy.

## Node-RED message mappings (default)

Each command or state field is a mapping. In the default mode, enter a topic name. Command topics consume msg.payload; state topics publish msg.payload. Topic matching is exact and wildcards are not supported.

```js
msg.topic = 'living-room/brightness'
msg.payload = 60
return msg
```

Use booleans for on/off, percentages for brightness, Kelvin for colour temperature and an object with red, green and blue properties for RGB. Relative dimming uses an object with decr_incr and data. Scene recall accepts the configured scene number, or a boolean for a single scene.

### Philips Hue API v2 input messages

For device functions with an input pin, you can also send a native Philips Hue API v2 command instead of using a topic/payload mapping. Put the API properties directly on msg, not inside msg.payload. For example, to switch on a light:

```js
msg = { on: { on: true } }
return msg
```

Send only properties supported by the selected Hue resource. The native command is forwarded to Hue as supplied.

## Optional KNX integration

Select a KNX Ultimate gateway only when this flow must exchange group-address telegrams. Mapping fields then accept group addresses or ETS names and show the applicable DPT selector. Clear the optional integration to return to Node-RED topics; no KNX package or gateway is required for message-based flows.

## Editor behaviour and diagnostics

- Saved mappings are rendered immediately, even while the Hue Bridge resource catalogue is still loading.
- For lights, Dim, Tunable White, RGB/HSV and native effects follow the live <code>dimming</code>, <code>color_temperature</code>, <code>color</code> and effects capabilities.
- A failed capability request never erases the saved configuration. Node-RED shows a dismissible error and keeps the editor usable.
- Changing the selected resource is only a preview until Save. Cancel restores the previous resource, function and mappings.

## Converting legacy HUE nodes

When legacy HUE nodes are present, the conversion action first downloads a local flow backup. It preserves node IDs, configuration references, positions and wiring, then leaves the result undeployed for review. Inspect every converted node before clicking Deploy.

[Watch the legacy HUE conversion video](https://youtu.be/f0Evf2QFI7c)

### Light / grouped light (`light`)

Controls a light or grouped light: on/off, relative and absolute brightness, colour temperature, RGB/HSV, effects and day/night behaviour.

<span id="hue-controller-help-plug" data-hue-controller-type="plug"></span>

### Plug / outlet (`plug`)

Controls a Hue plug and publishes its on/off and reported power state.

<span id="hue-controller-help-button" data-hue-controller-type="button"></span>

Publishes short, long and repeat button events and can map them to switch or dim commands.

<span id="hue-controller-help-relative_rotary" data-hue-controller-type="relative_rotary"></span>
