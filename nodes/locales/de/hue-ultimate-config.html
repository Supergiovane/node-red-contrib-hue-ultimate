## Hue Bridge

Dieser Konfigurations-Node verbindet HUE Ultimate mit einer Philips Hue Bridge. Mehrere HUE Controller können dieselbe Konfiguration verwenden.

### Bridge koppeln

1. Gib die feste IP-Adresse ein oder wähle eine im lokalen Netzwerk gefundene Bridge.
2. Klicke auf **VERBINDEN** und drücke danach die physische Link-Taste an der Bridge.
3. Warte auf den Abschluss der Registrierung, speichere die Konfiguration und führe Deploy aus.

Mit **CANCEL** beendest du das Warten, ohne gespeicherte Zugangsdaten zu ändern.

### Vorhandene Zugangsdaten

Klicke auf **ICH HABE BEREITS DIE ZUGANGSDATEN**, um Benutzername und Client-Schlüssel manuell einzugeben. Beide Felder bleiben bearbeitbar, sodass Zugangsdaten einer vorhandenen Installation ohne erneute Kopplung verwendet werden können.

### Eigenschaften

| Eigenschaft | Beschreibung |
|--|--|
| IP | Feste Adresse der Hue Bridge. Die Aktualisierung wiederholt die lokale Suche. |
| Name | Anzeigename, der nach erfolgreicher Verbindung gelesen wird. |
| Bridge-ID | Stabile Kennung, die von der Bridge gemeldet wird. |
| Benutzername | Bei der Kopplung gelieferter oder manuell eingetragener Anwendungsbenutzername. |
| Client-Schlüssel | Bei der Kopplung gelieferter oder manuell eingetragener Anwendungsschlüssel. |

[Dokumentation zu HUE Controller](https://supergiovane.github.io/node-red-contrib-hue-ultimate/de/nodes.html)
