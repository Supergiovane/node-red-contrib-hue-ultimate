<script type="text/javascript" src="resources/node-red-contrib-hue-ultimate/topicMappingEditor.js"></script>
<script type="text/javascript" src="resources/node-red-contrib-hue-ultimate/11f26b4500.js"></script>
<script type="text/javascript" src="resources/node-red-contrib-hue-ultimate/htmlUtils.js"></script>
<script type="text/javascript" src="resources/node-red-contrib-hue-ultimate/hueControllerEditorSelection.js"></script>
<script type="text/javascript" src="resources/node-red-contrib-hue-ultimate/hueControllerProfiles.js"></script>
<script type="text/javascript" src="resources/node-red-contrib-hue-ultimate/hueControllerMigration.js"></script>
<script type="text/javascript" src="resources/node-red-contrib-hue-ultimate/flowMigrationBackup.js"></script>
<script type="text/javascript" src="resources/node-red-contrib-hue-ultimate/hueControllerMigrationDialog.js"></script>

<script type="text/javascript">
  (function () {
    // Editor architecture
    // -------------------
    // HUE Controller is registered once, but hosts fifteen private editors. The
    // resource loaded above owns their JavaScript, HTML and translations; this
    // wrapper only selects a profile and bridges its lifecycle to one Node-RED
    // dialog. In particular, nothing below queries RED.nodes for a legacy type.
    //
    // Keep this browser-facing catalog aligned with the canonical build catalog
    // in scripts/hue-controller-profiles/catalog.js. Tests guard that alignment,
    // including the independent runtime map.
    const PROFILE_TYPES = Object.freeze({
      light: { nodeType: 'knxUltimateHueLight', label: 'HUE Light / grouped light' },
      plug: { nodeType: 'knxUltimateHuePlug', label: 'HUE Plug / outlet' },
      button: { nodeType: 'knxUltimateHueButton', label: 'HUE Button' },
      relative_rotary: { nodeType: 'knxUltimateHueTapDial', label: 'HUE Tap dial' },
      motion: { nodeType: 'knxUltimateHueMotion', label: 'HUE Motion' },
      area_motion: { nodeType: 'knxUltimateHueAreaMotion', label: 'HUE Area motion' },
      camera_motion: { nodeType: 'knxUltimateHueCameraMotion', label: 'HUE Camera motion' },
      contact: { nodeType: 'knxUltimateHueContactSensor', label: 'HUE Contact' },
      light_level: { nodeType: 'knxUltimateHueLightSensor', label: 'HUE Light level' },
      temperature: { nodeType: 'knxUltimateHueTemperatureSensor', label: 'HUE Temperature' },
      humidity: { nodeType: 'knxUltimateHueHumiditySensor', label: 'HUE Humidity' },
      scene: { nodeType: 'knxUltimateHueScene', label: 'HUE Scene' },
      device_power: { nodeType: 'knxUltimateHueBattery', label: 'HUE Battery' },
      zigbee_connectivity: { nodeType: 'knxUltimateHueZigbeeConnectivity', label: 'HUE Zigbee connectivity' },
      device_software_update: { nodeType: 'knxUltimateHuedevice_software_update', label: 'HUE Device software update' }
    });
    // Node-RED 4.x uses `_ADD_` both for the visible "none" option (when
    // gateways exist) and for "Add new..." (when none exist).
    const KNX_EMPTY_SERVER_VALUES = new Set(['', 'none', '_add_', '__none__']);
    const HUE_EMPTY_SERVER_VALUES = new Set(['', 'none', '_add_', '__none__']);
    const normalizeKnxServerSelection = (value) => {
      const normalized = value === undefined || value === null ? '' : String(value).trim();
      return KNX_EMPTY_SERVER_VALUES.has(normalized.toLowerCase()) ? '' : normalized;
    };
    const normalizeHueServerSelection = (value) => {
      const normalized = value === undefined || value === null ? '' : String(value).trim();
      return HUE_EMPTY_SERVER_VALUES.has(normalized.toLowerCase()) ? '' : normalized;
    };
    const TUTORIALS_URL = 'https://www.youtube.com/playlist?list=PL9Yh1bjbLAYrU8PsVhW4xzEug2WtVFv3E';
    const profileBundle = window.HueStandaloneKNXUltimateHueControllerProfiles;
    const editorSelection = window.HueStandaloneKNXUltimateHueControllerEditorSelection;
    const shouldPreserveStoredSelection = editorSelection && typeof editorSelection.shouldPreserveStoredSelection === 'function'
      ? editorSelection.shouldPreserveStoredSelection
      : (event, nextValue, storedValue, emptyValues) => {
          const programmaticChange = !event || !event.originalEvent;
          const normalizedNext = nextValue === undefined || nextValue === null ? '' : String(nextValue).trim().toLowerCase();
          const normalizedStored = storedValue === undefined || storedValue === null ? '' : String(storedValue).trim().toLowerCase();
          return programmaticChange && emptyValues.has(normalizedNext) && !emptyValues.has(normalizedStored);
        };
    const resolveSelectedOrStoredSelection = editorSelection && typeof editorSelection.resolveSelectedOrStoredSelection === 'function'
      ? editorSelection.resolveSelectedOrStoredSelection
      : (selectedValue, storedValue, emptyValues) => {
          const selected = selectedValue === undefined || selectedValue === null ? '' : String(selectedValue).trim();
          const stored = storedValue === undefined || storedValue === null ? '' : String(storedValue).trim();
          return emptyValues.has(selected.toLowerCase())
            ? (emptyValues.has(stored.toLowerCase()) ? '' : stored)
            : selected;
        };
    const cloneEditorValue = editorSelection && typeof editorSelection.cloneEditorValue === 'function'
      ? editorSelection.cloneEditorValue
      : (value) => {
          if (value === undefined || value === null || typeof value !== 'object') return value;
          try { return JSON.parse(JSON.stringify(value)); } catch (error) { return value; }
        };
    const createEditorDraft = editorSelection && typeof editorSelection.createEditorDraft === 'function'
      ? editorSelection.createEditorDraft
      : (node, defaults) => {
          const draft = Object.create(node || {});
          Object.entries(defaults || {}).forEach(([key, property]) => {
            const value = Object.prototype.hasOwnProperty.call(node || {}, key) ? node[key] : property?.value;
            draft[key] = cloneEditorValue(value);
          });
          return draft;
        };
    // Let Node-RED's property pane commit config-node references. Besides
    // detecting the edit, it maintains each config node's `users` collection.
    const CONTROLLER_CONFIG_NODE_FIELDS = new Set(['server', 'serverHue']);

    const getProfileDefinition = (controllerType) => {
      // The bundle captures a private definition through a RED facade. It does
      // not register that definition and its presentation metadata is inert.
      if (!profileBundle || typeof profileBundle.getDefinition !== 'function') return undefined;
      return profileBundle.getDefinition(controllerType, RED);
    };

    const focusProfileHelp = (controllerType) => {
      // Node-RED renders localized help asynchronously after opening the dialog.
      // A few bounded retries focus the matching function without leaving a
      // timer running for the lifetime of the editor.
      const anchorId = `hue-controller-help-${controllerType}`;
      let attempts = 0;
      const focus = () => {
        const marker = document.getElementById(anchorId);
        if (marker && typeof marker.scrollIntoView === 'function') {
          marker.scrollIntoView({ block: 'start' });
          return;
        }
        attempts += 1;
        if (attempts < 4) setTimeout(focus, 100);
      };
      setTimeout(focus, 0);
    };

    const buildDefaults = () => {
      // Node-RED persists only keys declared at registration time. Build the
      // union once so changing function inside the dialog never drops fields
      // belonging to the newly selected profile.
      const defaults = {
        // Keep config-node references explicit. Node-RED must see their `type`
        // while this node is registered or it renders plain text inputs instead
        // of managed config-node selectors.
        server: { value: '', type: 'knxUltimate-config', required: false },
        serverHue: { value: '', type: 'hue-ultimate-config', required: true },
        name: { value: '' },
        hueControllerType: { value: 'light', required: true },
        inputs: { value: 0 },
        outputs: { value: 0 }
      };
      Object.keys(PROFILE_TYPES).forEach((controllerType) => {
        const definition = getProfileDefinition(controllerType);
        Object.entries(definition?.defaults || {}).forEach(([key, property]) => {
          // HUE Controller starts as a light, so the first profile wins for
          // shared keys. Clone the descriptor because Node-RED may decorate it.
          if (!Object.prototype.hasOwnProperty.call(defaults, key)) defaults[key] = { ...property };
        });
      });
      // Dynamic pins must always be persisted by this node, regardless of whether
      // the selected legacy editor originally used fixed or configurable pins.
      defaults.inputs = { value: 0 };
      defaults.outputs = { value: 0 };
      return defaults;
    };

    const setFieldValue = ($field, value) => {
      // Property keys come from the private definition, never from CSS classes:
      // jQuery UI mutates classes when it upgrades fields into widgets.
      if (!$field.length) return;
      if ($field.is(':checkbox')) {
        $field.prop('checked', value === true || value === 'true' || value === 'yes');
      } else if ($field.is(':radio')) {
        $field.filter(`[value="${String(value).replace(/"/g, '\\"')}"]`).prop('checked', true);
      } else if (value !== undefined && value !== null) {
        $field.val(typeof value === 'object' ? JSON.stringify(value) : value);
      }
    };

    const readFieldValue = ($field, currentValue) => {
      // Mirror setFieldValue for the untouched-save round trip. Missing elements
      // retain their current value instead of silently becoming undefined.
      if (!$field.length) return currentValue;
      if ($field.is(':checkbox')) return $field.prop('checked');
      if ($field.is(':radio')) return $field.filter(':checked').val();
      const value = $field.val();
      // DPT options are loaded asynchronously by the mounted profile. A select
      // can therefore temporarily have no selected option even though the node
      // has a valid saved value. Preserve that value when Save is pressed while
      // the request is still in flight instead of persisting null.
      if ($field.is('select') && (value === undefined || value === null)) {
        return currentValue;
      }
      return value;
    };

    const translateProfileEditor = ($container, controllerType, nodeType) => {
      // Injected fragments miss Node-RED's initial i18n pass and belong to the
      // original profile namespace. Resolve them against the private dictionaries;
      // the bundle applies the active-locale, English and RED._ fallbacks.
      $container.find('[data-i18n]').each(function () {
        const $element = $(this);
        const translationSpec = String($element.attr('data-i18n') || '').trim();
        if (!translationSpec) return;

        const attributeMatch = translationSpec.match(/^\[([^\]]+)](.+)$/);
        const attributeName = attributeMatch ? attributeMatch[1] : undefined;
        const translationKey = attributeMatch ? attributeMatch[2] : translationSpec;
        const qualifiedKey = translationKey.includes(':')
          ? translationKey
          : `node-red-contrib-knx-ultimate/${nodeType}:${translationKey}`;
        let translated;
        try {
          translated = profileBundle && typeof profileBundle.translate === 'function'
            ? profileBundle.translate(controllerType, qualifiedKey, RED)
            : RED._(qualifiedKey);
        } catch (error) { /* empty */ }
        if (!translated || translated === qualifiedKey || translated === translationKey) return;

        if (attributeName) $element.attr(attributeName, translated);
        else $element.text(translated);
        // The fragment belongs to the selected legacy node namespace. Removing
        // the marker prevents the controller namespace from blanking it later.
        $element.removeAttr('data-i18n');
      });
    };

    const ensureControllerEditorStyle = () => {
      // Styles are scoped to the mounted fragment so no legacy editor or other
      // Node-RED dialog is affected. Insert them once per browser page.
      if ($('#hueUltimateControllerEditorStyle').length) return;
      $('head').append(`
        <style id="hueUltimateControllerEditorStyle">
          /* Migration is an occasional but important action, so give it a
             strong warning-orange treatment that remains legible in both the
             light and dark Node-RED editor themes. */
          #hue-controller-migrate-legacy-flow.red-ui-button {
            background: #d97706 !important;
            border-color: #b45309 !important;
            color: #ffffff !important;
            font-weight: 700;
            box-shadow: 0 2px 7px rgba(146, 64, 14, 0.35);
          }
          #hue-controller-migrate-legacy-flow.red-ui-button:hover {
            background: #b45309 !important;
            border-color: #92400e !important;
          }
          #hue-controller-migrate-legacy-flow.red-ui-button:active {
            background: #92400e !important;
          }
          #hue-controller-migrate-legacy-flow.red-ui-button:focus-visible {
            outline: 3px solid #fbbf24;
            outline-offset: 2px;
          }
          #hue-controller-profile-editor .hue-controller-knx-flow-only-notice {
            box-sizing: border-box;
            padding: 9px 12px;
            margin: 0 0 12px;
            border-left: 4px solid #d79b00;
            background: #fff8df;
            color: #4d3a00;
          }
          /* Every profile inherited slightly different fixed KNX widths. Mark
             actual DPT rows after mounting and compact only their DPT/Name
             controls. No wrapping keeps one mapping on one visual line, while the
             small flex allowance lets Name contract on narrow editor trays. */
          #hue-controller-profile-editor .hue-controller-knx-mapping-row {
            display: flex;
            align-items: center;
            flex-wrap: nowrap !important;
          }
          #hue-controller-profile-editor .hue-controller-knx-mapping-row > label {
            flex-shrink: 0;
          }
          #hue-controller-profile-editor .hue-controller-knx-mapping-row > select[id^="node-input-dpt"] {
            box-sizing: border-box;
            width: 105px !important;
            min-width: 90px !important;
            max-width: 105px !important;
            flex: 0 1 105px !important;
          }
          #hue-controller-profile-editor .hue-controller-knx-mapping-row > input[type="text"][id^="node-input-name"] {
            box-sizing: border-box;
            width: 115px !important;
            min-width: 70px !important;
            max-width: 115px !important;
            flex: 0 1 115px !important;
          }
        </style>
      `);
    };

    const controllerMessage = (key, values) => {
      try {
        const messageKey = `node-red-contrib-hue-ultimate/hueUltimateController:hueUltimateController.${key}`;
        const translated = RED._(messageKey, values);
        if (translated && translated !== messageKey) return translated;
      } catch (error) { /* empty */ }
      return undefined;
    };

    const migrationText = (_node, key, fallback, values) => {
      const translated = controllerMessage(key, values);
      if (translated) return translated;
      return fallback;
    };

    const editorContainsLegacyHueNodes = () => {
      // Include dedicated legacy nodes, the old multimode Controller and bridge
      // configurations, using the same targets as the startup migration notice.
      const migration = window.HueUltimateMigration;
      return Boolean(migration && migration.hasLegacyNodes());
    };

    const openLegacyMigrationDialog = () => {
      if (window.HueUltimateMigration) window.HueUltimateMigration.prompt();
      return () => {};
    };

    RED.nodes.registerType('hueUltimateController', {
      category: 'HUE Ultimate',
      color: '#F2CE72',
      defaults: buildDefaults(),
      // catalogDefaults is consumed by the Cerebrum Ultimate catalog. It intentionally
      // describes only the stable public surface; the real persistence contract
      // remains the complete `defaults` union above.
      catalogDefaults: {
        server: { type: 'knxUltimate-config' },
        serverHue: { type: 'hue-ultimate-config' },
        name: {},
        hueControllerType: {},
        hueDevice: {},
        enableNodePINS: {},
        inputs: {},
        outputs: {}
      },
      inputs: 0,
      outputs: 0,
      icon: 'node-hue-icon.svg',
      label() {
        const profile = PROFILE_TYPES[this.hueControllerType] || PROFILE_TYPES.light;
        let typeLabel = profile.label;
        try {
          const translationKey = `node-red-contrib-hue-ultimate/hueUltimateController:hueUltimateController.types.${this.hueControllerType || 'light'}`;
          const translated = RED._(translationKey);
          if (translated && translated !== translationKey) typeLabel = translated;
        } catch (error) { /* use catalog fallback */ }
        return this.name || `HUE Controller · ${typeLabel}`;
      },
      paletteLabel: 'HUE Controller',
      oneditprepare() {
        try { RED.sidebar.show('help'); } catch (error) { /* empty */ }
        ensureControllerEditorStyle();
        const persistedNode = this;
        const editorDefaults = buildDefaults();
        // Profile editors need a mutable node-shaped object while the dialog is
        // open. Keep that preview state off the persisted node: Node-RED compares
        // the persisted values only after oneditsave to set dirty/history state.
        const controllerNode = createEditorDraft(persistedNode, editorDefaults);
        // activeProfile/legacyContext describe the currently mounted function.
        // Drafts preserve unsaved edits when the user switches away and back;
        // the migration closer prevents detached jQuery dialogs and handlers.
        let activeProfile;
        let activeControllerType;
        let legacyContext;
        let closeMigrationDialog = () => { };
        const profileDrafts = {};
        let cachedHueResources = [];
        let selectedHueResource;
        let activeHueServerId;
        let hueDevicePickerMouseDown = false;
        let hueCatalogReady = false;
        let hueReadinessTimer;
        let hueUnreachableTimer;
        let hueReadinessAttempts = 0;
        let hueReadinessErrorShown = false;
        let hueBridgeUnreachable = false;
        let hueEditorClosed = false;
        const HUE_READINESS_INTERVAL_MS = 2000;
        const HUE_READINESS_MAX_ATTEMPTS = 60;
        const HUE_UNREACHABLE_TIMEOUT_MS = 15000;
        const defaultHueDevicePlaceholder = $('#node-input-name').attr('placeholder') || '';

        const hasLegacyHueNodes = editorContainsLegacyHueNodes();
        const $migrationButton = $('#hue-controller-migrate-legacy-flow');
        $('#hue-controller-migrate-legacy-flow-row').toggle(hasLegacyHueNodes);
        $migrationButton.off('.hueUltimateControllerMigration');
        if (hasLegacyHueNodes) {
          $migrationButton.on('click.hueUltimateControllerMigration', () => {
            closeMigrationDialog();
            closeMigrationDialog = openLegacyMigrationDialog(controllerNode);
          });
        }

        // Retain a final safety snapshot for profile callbacks that might reach
        // the persisted node indirectly through Node-RED APIs. Normal previews
        // are isolated in controllerNode and never require rollback.
        const originalEditorState = {};
        Object.keys(editorDefaults).forEach((key) => {
          originalEditorState[key] = {
            present: Object.prototype.hasOwnProperty.call(persistedNode, key),
            value: cloneEditorValue(persistedNode[key])
          };
        });
        const restoreOriginalEditorState = () => {
          Object.entries(originalEditorState).forEach(([key, snapshot]) => {
            if (snapshot.present) persistedNode[key] = cloneEditorValue(snapshot.value);
            else delete persistedNode[key];
          });
        };

        const collectCurrentEditor = () => {
          // Collect before unmounting. Exact keys come from the selected private
          // definition, avoiding broad DOM scans and widget-added CSS classes.
          if (!activeProfile || !legacyContext) return;
          const mountedControllerType = activeControllerType || controllerNode.hueControllerType;
          const definition = getProfileDefinition(mountedControllerType);
          const draft = {};
          Object.keys(definition?.defaults || {}).forEach((key) => {
            const fieldValue = readFieldValue($(`#node-input-${key}`), controllerNode[key]);
            let value = fieldValue;
            if (key === 'server') {
              value = resolveSelectedOrStoredSelection(fieldValue, controllerNode.server, KNX_EMPTY_SERVER_VALUES);
            } else if (key === 'serverHue') {
              value = resolveSelectedOrStoredSelection(fieldValue, controllerNode.serverHue, HUE_EMPTY_SERVER_VALUES);
            }
            controllerNode[key] = value;
            legacyContext[key] = value;
            draft[key] = cloneEditorValue(value);
          });
          profileDrafts[mountedControllerType] = draft;
          if (Number.isFinite(Number(legacyContext.inputs))) controllerNode.inputs = Number(legacyContext.inputs);
          if (Number.isFinite(Number(legacyContext.outputs))) controllerNode.outputs = Number(legacyContext.outputs);
        };

        const disposeCurrentEditor = () => {
          // A profile can attach handlers or allocate editor-only state. Reuse
          // its cancel hook when changing function, then remove the two handler
          // namespaces that belong specifically to this wrapper.
          if (!activeProfile || !legacyContext) return;
          $('#node-input-server').off('.hueUltimateControllerLightVisibility');
          $(document).off('change.hueUltimateControllerKnxVisibility', '#node-input-server');
          const definition = getProfileDefinition(activeControllerType || controllerNode.hueControllerType);
          try {
            if (definition && typeof definition.oneditcancel === 'function') {
              definition.oneditcancel.call(legacyContext);
            }
          } finally {
            activeProfile = undefined;
            activeControllerType = undefined;
            legacyContext = undefined;
          }
        };

        const prepareProfileValues = (controllerType, definition) => {
          // Returning to a profile restores its in-dialog draft. First visits use
          // that profile's defaults, except shared gateway selections which must
          // survive every function change.
          const draft = profileDrafts[controllerType];
          Object.entries(definition?.defaults || {}).forEach(([key, property]) => {
            if (draft && Object.prototype.hasOwnProperty.call(draft, key)) {
              controllerNode[key] = cloneEditorValue(draft[key]);
            } else if (key !== 'server' && key !== 'serverHue') {
              controllerNode[key] = cloneEditorValue(property.value);
            }
          });
        };

        const controllerText = (key, fallback) => {
          const translated = controllerMessage(key);
          if (translated) return translated;
          return fallback;
        };

        const resolveHueServerId = ({ allowStored = false } = {}) => {
          const domValue = $('#node-input-serverHue').val();
          if (domValue !== undefined && domValue !== null) {
            const normalized = String(domValue).trim();
            if (normalized !== '' && !HUE_EMPTY_SERVER_VALUES.has(normalized.toLowerCase())) return normalized;
          }
          if (allowStored && controllerNode.serverHue !== undefined && controllerNode.serverHue !== null) {
            const stored = String(controllerNode.serverHue).trim();
            if (stored !== '' && !HUE_EMPTY_SERVER_VALUES.has(stored.toLowerCase())) return stored;
          }
          return '';
        };

        const getHueDeviceValue = () => {
          const domValue = $('#node-input-hueDevice').val();
          if (domValue !== undefined && domValue !== null && String(domValue).trim() !== '') return String(domValue).trim();
          return controllerNode.hueDevice === undefined || controllerNode.hueDevice === null
            ? ''
            : String(controllerNode.hueDevice).trim();
        };

        const getRawHueResourceId = (value) => String(value || '').split('#')[0];

        const updateSelectedDevicePresentation = (controllerType = controllerNode.hueControllerType) => {
          // A persisted device remains visible while its Hue Bridge is offline.
          // Catalog readiness controls discovery and editing of the device
          // selection, not whether saved mappings remain usable in the editor.
          const hueServerSelected = resolveHueServerId({ allowStored: true }) !== '';
          const hasDevice = hueServerSelected && getHueDeviceValue() !== '';
          const profile = PROFILE_TYPES[controllerType] || PROFILE_TYPES.light;
          const typeLabel = controllerText(`types.${controllerType}`, profile.label);
          $('#hue-controller-selected-device-type-value').text(typeLabel);
          $('#hue-controller-selected-device-type').toggle(hasDevice);
          $('#hue-controller-locate-device').toggle(hasDevice && controllerType === 'light');
          $('#hue-controller-profile-editor').toggle(hasDevice);
          $('#node-input-hueControllerType').val(controllerType);
        };

        const updateHueDeviceControlVisibility = () => {
          const hueServerSelected = resolveHueServerId({ allowStored: true }) !== '';
          const hasPersistedDevice = getHueDeviceValue() !== '';
          const deviceControlVisible = hueServerSelected && (hueCatalogReady || hasPersistedDevice);
          const deviceCatalogPending = hueServerSelected && !hueCatalogReady;
          $('#hue-controller-device-row').toggle(deviceControlVisible);
          $('#node-input-name').prop('disabled', hueServerSelected && !hueCatalogReady);
          $('#hue-controller-devices-loading').toggle(deviceCatalogPending);
          $('#hue-controller-devices-waiting').toggle(!hueBridgeUnreachable);
          $('#hue-controller-devices-unreachable').toggle(hueBridgeUnreachable);
          if (!deviceControlVisible) {
            $('#hue-controller-selected-device-type').hide();
            $('#hue-controller-locate-device').hide();
            $('#hue-controller-profile-editor').hide();
            return;
          }
          updateSelectedDevicePresentation();
        };

        const filterHueResources = (term) => {
          const search = String(term || '').replace(/exactmatch/gi, '').trim().toLowerCase();
          return cachedHueResources.filter((item) => {
            if (search === '') return true;
            return String(item.name || item.id || '').toLowerCase().includes(search);
          }).map((item) => ({
            ...item,
            value: item.name || item.id,
            label: item.name || item.id
          }));
        };

        const reconcileSavedHueResource = () => {
          const savedDevice = getHueDeviceValue();
          if (savedDevice === '') return;
          const rawId = getRawHueResourceId(savedDevice);
          const match = cachedHueResources.find((item) => item.hueDevice === savedDevice)
            || cachedHueResources.find((item) => item.id === rawId && item.controllerType === controllerNode.hueControllerType)
            || cachedHueResources.find((item) => item.id === rawId);
          if (!match) {
            updateSelectedDevicePresentation();
            return;
          }
          selectedHueResource = match;
          if (!$('#node-input-name').val()) $('#node-input-name').val(match.name || match.id);
          if (match.controllerType !== controllerNode.hueControllerType) {
            applyHueResourceSelection(match);
            return;
          }
          updateSelectedDevicePresentation(match.controllerType);
        };

        const fetchHueResources = (term, response, { forceRefresh = false } = {}) => {
          const reply = typeof response === 'function' ? response : () => { };
          const hueServerId = resolveHueServerId({ allowStored: true });
          if (hueServerId === '') {
            hueCatalogReady = false;
            updateHueDeviceControlVisibility();
            reply([]);
            return;
          }
          if (!forceRefresh && cachedHueResources.length > 0) {
            hueCatalogReady = true;
            updateHueDeviceControlVisibility();
            reply(filterHueResources(term));
            return;
          }
          const refreshQuery = forceRefresh ? '&forceRefresh=1' : '';
          $.getJSON(`hueUltimate/KNXUltimateGetResourcesHUE?rtype=hue_controller&serverId=${encodeURIComponent(hueServerId)}${refreshQuery}&_=${Date.now()}`, (data) => {
            if (hueEditorClosed) return;
            if (resolveHueServerId({ allowStored: true }) !== hueServerId) {
              reply([]);
              return;
            }
            const devices = Array.isArray(data) ? data : (Array.isArray(data?.devices) ? data.devices : []);
            cachedHueResources = devices.filter((item) => item && PROFILE_TYPES[item.controllerType] && item.id && item.hueDevice);
            hueCatalogReady = data?.ready === true;
            $('#node-input-name').attr('placeholder', cachedHueResources.length > 0
              ? defaultHueDevicePlaceholder
              : controllerText('no_devices', 'No Hue resources found. Check the Hue Bridge and press refresh.'));
            updateHueDeviceControlVisibility();
            if (hueCatalogReady) reconcileSavedHueResource();
            reply(filterHueResources(term));
          }).fail(() => {
            if (hueEditorClosed) return;
            cachedHueResources = [];
            hueCatalogReady = false;
            updateHueDeviceControlVisibility();
            $('#node-input-name').attr('placeholder', controllerText('no_devices', 'No Hue resources found. Check the Hue Bridge and press refresh.'));
            reply([]);
          });
        };

        const clearHueReadinessTimer = () => {
          if (hueReadinessTimer !== undefined) clearTimeout(hueReadinessTimer);
          hueReadinessTimer = undefined;
        };

        const clearHueUnreachableTimer = () => {
          if (hueUnreachableTimer !== undefined) clearTimeout(hueUnreachableTimer);
          hueUnreachableTimer = undefined;
        };

        const probeHueBridgeReadiness = ({ reset = false, openPicker = false } = {}) => {
          clearHueReadinessTimer();
          if (reset) {
            hueReadinessAttempts = 0;
            hueReadinessErrorShown = false;
            hueBridgeUnreachable = false;
            clearHueUnreachableTimer();
          }
          const expectedServerId = resolveHueServerId({ allowStored: true });
          if (expectedServerId === '') {
            clearHueUnreachableTimer();
            hueCatalogReady = false;
            updateHueDeviceControlVisibility();
            return;
          }
          if (reset) {
            hueUnreachableTimer = setTimeout(() => {
              if (hueEditorClosed) return;
              if (resolveHueServerId({ allowStored: true }) !== expectedServerId || hueCatalogReady) return;
              hueBridgeUnreachable = true;
              updateHueDeviceControlVisibility();
            }, HUE_UNREACHABLE_TIMEOUT_MS);
          }
          updateHueDeviceControlVisibility();
          hueReadinessAttempts += 1;
          fetchHueResources('', (items) => {
            if (resolveHueServerId({ allowStored: true }) !== expectedServerId) return;
            if (hueCatalogReady) {
              clearHueUnreachableTimer();
              hueBridgeUnreachable = false;
              updateHueDeviceControlVisibility();
              if (openPicker && items.length) $('#node-input-name').autocomplete('search', '');
              return;
            }
            if (hueReadinessAttempts >= HUE_READINESS_MAX_ATTEMPTS) {
              if (!hueReadinessErrorShown) {
                hueReadinessErrorShown = true;
                updateHueDeviceControlVisibility();
                RED.notify(controllerText(
                  'hue_bridge_not_ready',
                  'The Hue Bridge did not become ready. Check its connection and reopen the editor.'
                ), { type: 'error', fixed: true });
              }
              return;
            }
            hueReadinessTimer = setTimeout(() => {
              probeHueBridgeReadiness({ openPicker });
            }, HUE_READINESS_INTERVAL_MS);
          }, { forceRefresh: true });
        };

        const configureUnifiedDeviceControl = () => {
          const $deviceName = $('#node-input-name');
          if (!$deviceName.length) return;
          $deviceName.autocomplete({
            minLength: 0,
            source(request, response) {
              if (!hueCatalogReady) {
                response([]);
                return;
              }
              fetchHueResources(request.term, response);
            },
            select(event, ui) {
              applyHueResourceSelection(ui.item);
              return false;
            },
            change(event, ui) {
              if (ui.item || selectedHueResource?.name === $deviceName.val()) return;
              selectedHueResource = undefined;
              controllerNode.hueDevice = '';
              $('#node-input-hueDevice').val('');
              updateSelectedDevicePresentation();
            }
          });
          $deviceName.off('.hueUltimateControllerDevice')
            .on('mousedown.hueUltimateControllerDevice', () => {
              hueDevicePickerMouseDown = true;
            })
            .on('focus.hueUltimateControllerDevice', function () {
              if (!hueDevicePickerMouseDown) $(this).autocomplete('search', '');
            })
            .on('click.hueUltimateControllerDevice', function () {
              hueDevicePickerMouseDown = false;
              const input = this;
              setTimeout(() => $(input).autocomplete('search', ''), 0);
            })
            .on('blur.hueUltimateControllerDevice', () => {
              hueDevicePickerMouseDown = false;
            });
        };

        const applyHueResourceSelection = (item) => {
          if (!item || !PROFILE_TYPES[item.controllerType] || !item.hueDevice) return;
          const nextType = item.controllerType;
          const typeChanged = nextType !== controllerNode.hueControllerType;
          collectCurrentEditor();
          if (typeChanged) prepareProfileValues(nextType, getProfileDefinition(nextType));
          selectedHueResource = item;
          controllerNode.hueControllerType = nextType;
          controllerNode.name = item.name || item.id;
          controllerNode.hueDevice = item.hueDevice;
          if (item.deviceObject) controllerNode.hueDeviceObject = cloneEditorValue(item.deviceObject);
          const nextDefinition = getProfileDefinition(nextType);
          controllerNode.inputs = Number(nextDefinition?.inputs || 0);
          controllerNode.outputs = Number(nextDefinition?.outputs || 0);
          $('#node-input-name').val(controllerNode.name);
          $('#node-input-hueDevice').val(controllerNode.hueDevice);
          $('#node-input-hueControllerType').val(nextType);
          renderProfileEditor(nextType, true);
          updateSelectedDevicePresentation(nextType);
        };

        const renderProfileEditor = (controllerType, skipCollect) => {
          // Controlled lifecycle transition:
          // collect old -> dispose old -> mount private HTML -> translate ->
          // restore values -> execute the selected profile's oneditprepare.
          if (skipCollect !== true) collectCurrentEditor();
          disposeCurrentEditor();
          const profile = PROFILE_TYPES[controllerType] || PROFILE_TYPES.light;
          const definition = getProfileDefinition(controllerType);
          const template = profileBundle && typeof profileBundle.getTemplate === 'function'
            ? profileBundle.getTemplate(controllerType)
            : undefined;
          const $container = $('#hue-controller-profile-editor');
          $container.toggleClass('hue-controller-light-profile', controllerType === 'light');

          if (!definition || !template) {
            $container.html($('<div class="hue-controller-editor-error"></div>').text(
              controllerText('editor_unavailable', 'The selected Hue editor is unavailable. Restart Node-RED after updating the package.')
            ));
            return;
          }

          activeProfile = profile;
          activeControllerType = controllerType;
          controllerNode.hueControllerType = controllerType;
          // Some dedicated definitions used fixed pins, others persisted them.
          // Normalize both forms into per-instance numeric Controller pins.
          if (!definition.defaults?.inputs) controllerNode.inputs = Number(definition.inputs || 0);
          if (!definition.defaults?.outputs) controllerNode.outputs = Number(definition.outputs || 0);
          controllerNode.inputs = Number.isFinite(Number(controllerNode.inputs))
            ? Number(controllerNode.inputs)
            : Number(definition.inputs || 0);
          controllerNode.outputs = Number.isFinite(Number(controllerNode.outputs))
            ? Number(controllerNode.outputs)
            : Number(definition.outputs || 0);

          const $profileContent = $('<div></div>').html(template);
          // The unified editor owns the single playlist link at the top.
          $profileContent.find(`a[href="${TUTORIALS_URL}"]`).each(function () {
            $(this).closest('.form-row').remove();
          });
          // This notice belongs only to the dedicated legacy node editor. The
          // current editor is already HUE Controller, so do not repeat it here.
          $profileContent.find('.hue-legacy-controller-notice').remove();
          // Configuration-node fields must exist before oneditprepare so Node-RED
          // can turn them into its managed selectors. The unified template owns
          // those two fixed fields; remove the duplicate legacy rows.
          $profileContent.find('#node-input-server, #node-input-serverHue').each(function () {
            $(this).closest('.form-row').remove();
          });
          // Device selection belongs to the unified wrapper. Remove the private
          // profile's duplicate row/hidden value while keeping the static fields
          // available to its mature lifecycle callbacks.
          $profileContent.find('#node-input-name').each(function () {
            $(this).closest('.form-row').remove();
          });
          $profileContent.find('#node-input-hueDevice').remove();
          $container.empty().append($profileContent.contents());
          // Node-RED translates the static dialog before oneditprepare. This
          // fragment belongs to another node type, so qualify every key with the
          // selected profile's namespace instead of the controller namespace.
          translateProfileEditor($container, controllerType, profile.nodeType);
          // A row containing a DPT selector is a KNX mapping row regardless of
          // which private profile supplied it. Tagging by the strict field ID
          // avoids coupling the Controller layout to legacy CSS class names.
          $container.find('select[id^="node-input-dpt"]').each(function () {
            $(this).closest('.form-row').addClass('hue-controller-knx-mapping-row');
          });
          Object.keys(definition.defaults || {}).forEach((key) => {
            setFieldValue($(`#node-input-${key}`), controllerNode[key]);
          });

          // The inherited context lets mature callbacks read the Controller's
          // properties while isolating their temporary mutations. Never assign
          // `legacyContext.type`: that could save the node under a legacy type.
          legacyContext = Object.create(controllerNode);
          legacyContext._ = definition._;
          legacyContext.inputs = controllerNode.inputs;
          legacyContext.outputs = controllerNode.outputs;
          // Light deliberately receives the real Hue config-node selection.
          // Its private editor owns the bounded readiness poll and displays the
          // hourglass until the bridge resources are available or it times out.
          // The Light editor completes asynchronously and installs its historic
          // light-only autocomplete inside Go(). Give it an explicit callback
          // that restores the Controller-wide catalog after that late setup.
          controllerNode.__configureHueControllerDeviceControl = configureUnifiedDeviceControl;
          if (typeof definition.oneditprepare === 'function') {
            definition.oneditprepare.call(legacyContext);
          }
          configureUnifiedDeviceControl();
          // Profile guidance is already available in the node help. Keeping it
          // out of the embedded editor makes every device profile more compact.
          $container.find('.form-tips').remove();

          const $knxFlowOnlyNotice = $container.find('.hue-controller-knx-flow-only-notice');
          const $lightTabs = $container.find('#tabs');
          $knxFlowOnlyNotice.text('Topic → msg.payload');

          const updateControllerKnxVisibility = () => {
            // Node-RED has used several sentinel values for an empty config-node
            // selector. During editor bootstrap the DOM can temporarily expose
            // one of them even though the node has a persisted gateway, so use
            // the stored reference as a fallback before hiding the Light tabs.
            const serverValue = $('#node-input-server').val();
            const normalizedServerValue = serverValue === undefined || serverValue === null
              ? ''
              : String(serverValue).trim().toLowerCase();
            const storedServerValue = controllerNode.server === undefined || controllerNode.server === null
              ? ''
              : String(controllerNode.server).trim().toLowerCase();
            const hasDomServer = !KNX_EMPTY_SERVER_VALUES.has(normalizedServerValue);
            const hasStoredServer = !KNX_EMPTY_SERVER_VALUES.has(storedServerValue);
            const knxDisabled = !hasDomServer && !hasStoredServer;
            window.UltimateTopicMappingEditor.apply($, $container, knxDisabled, legacyContext || controllerNode);
            $knxFlowOnlyNotice.toggle(controllerType === 'light' && knxDisabled);
            if (controllerType === 'light' && $lightTabs.length) {
              // Both modes use the same mappings; only DPT controls differ.
              $lightTabs.css('display', 'flex');
              try { $lightTabs.tabs('refresh'); } catch (error) { /* raw tabs remain visible */ }
            }
          };
          const handleControllerKnxSelection = function (event) {
            // An explicit user choice must supersede the persisted bootstrap
            // fallback. Node-RED can represent "none" as `_ADD_`, so normalize
            // it before both editors recalculate their visibility.
            const selectedValue = $(this).val();
            if (shouldPreserveStoredSelection(event, selectedValue, controllerNode.server, KNX_EMPTY_SERVER_VALUES)) {
              updateControllerKnxVisibility();
              return;
            }
            const selectedServer = normalizeKnxServerSelection(selectedValue);
            controllerNode.server = selectedServer;
            if (legacyContext) legacyContext.server = selectedServer;
            updateControllerKnxVisibility();
          };
          updateControllerKnxVisibility();
          $(document)
            .off('change.hueUltimateControllerKnxVisibility', '#node-input-server')
            .on('change.hueUltimateControllerKnxVisibility', '#node-input-server', handleControllerKnxSelection);
          updateSelectedDevicePresentation(controllerType);
          focusProfileHelp(controllerType);
        };

        const selectedType = PROFILE_TYPES[this.hueControllerType] ? this.hueControllerType : 'light';
        $('#node-input-hueControllerType').val(selectedType);

        activeHueServerId = resolveHueServerId({ allowStored: true });
        $('#hue-controller-refresh-devices')
          .off('.hueUltimateControllerDevice')
          .on('click.hueUltimateControllerDevice', () => {
            cachedHueResources = [];
            hueCatalogReady = false;
            probeHueBridgeReadiness({ reset: true, openPicker: true });
          });
        $(document)
          .off('change.hueUltimateControllerHueServer', '#node-input-serverHue')
          .on('change.hueUltimateControllerHueServer', '#node-input-serverHue', (event) => {
            const selectedValue = $('#node-input-serverHue').val();
            if (shouldPreserveStoredSelection(event, selectedValue, controllerNode.serverHue, HUE_EMPTY_SERVER_VALUES)) {
              updateHueDeviceControlVisibility();
              updateSelectedDevicePresentation();
              return;
            }
            const nextServerId = normalizeHueServerSelection(selectedValue);
            if (nextServerId === activeHueServerId) return;
            activeHueServerId = nextServerId;
            controllerNode.serverHue = nextServerId;
            if (legacyContext) legacyContext.serverHue = nextServerId;
            clearHueReadinessTimer();
            clearHueUnreachableTimer();
            cachedHueResources = [];
            hueCatalogReady = false;
            hueReadinessErrorShown = false;
            hueBridgeUnreachable = false;
            selectedHueResource = undefined;
            controllerNode.name = '';
            controllerNode.hueDevice = '';
            $('#node-input-name, #node-input-hueDevice').val('');
            updateHueDeviceControlVisibility();
            updateSelectedDevicePresentation();
            if (nextServerId !== '') probeHueBridgeReadiness({ reset: true });
          });

        this._hueControllerCollectEditor = collectCurrentEditor;
        this._hueControllerGetEditorDraft = () => controllerNode;
        this._hueControllerGetActiveControllerType = () => activeControllerType;
        this._hueControllerGetLegacyContext = () => legacyContext;
        this._hueControllerGetProfile = () => activeProfile;
        this._hueControllerCloseMigration = () => closeMigrationDialog();
        this._hueControllerRestoreOriginalState = restoreOriginalEditorState;
        this._hueControllerCleanupDevice = () => {
          hueEditorClosed = true;
          clearHueReadinessTimer();
          clearHueUnreachableTimer();
          $('#hue-controller-refresh-devices, #node-input-serverHue, #node-input-name').off('.hueUltimateControllerDevice');
          $(document).off('change.hueUltimateControllerHueServer', '#node-input-serverHue');
          $(document).off('change.hueUltimateControllerKnxVisibility', '#node-input-server');
          delete controllerNode.__configureHueControllerDeviceControl;
        };
        renderProfileEditor(selectedType);
        updateHueDeviceControlVisibility();
        probeHueBridgeReadiness({ reset: true });
      },
      oneditsave() {
        // Preserve lifecycle order: close auxiliary UI, collect mounted fields,
        // let the profile normalize them, then copy values and dynamic pins back
        // onto the actual node that Node-RED will serialize.
        if (typeof this._hueControllerCloseMigration === 'function') this._hueControllerCloseMigration();
        if (typeof this._hueControllerCollectEditor === 'function') this._hueControllerCollectEditor();
        const profile = typeof this._hueControllerGetProfile === 'function'
          ? this._hueControllerGetProfile()
          : undefined;
        const legacyContext = typeof this._hueControllerGetLegacyContext === 'function'
          ? this._hueControllerGetLegacyContext()
          : undefined;
        const editorDraft = typeof this._hueControllerGetEditorDraft === 'function'
          ? this._hueControllerGetEditorDraft()
          : undefined;
        const activeControllerType = typeof this._hueControllerGetActiveControllerType === 'function'
          ? this._hueControllerGetActiveControllerType()
          : undefined;
        const selectedControllerType = editorDraft?.hueControllerType || this.hueControllerType;
        const definition = profile ? getProfileDefinition(activeControllerType || selectedControllerType) : undefined;
        if (definition && typeof definition.oneditsave === 'function') {
          definition.oneditsave.call(legacyContext || this);
        }
        if (legacyContext) {
          Object.keys(definition?.defaults || {}).forEach((key) => {
            // Config-node references must remain at their persisted values until
            // Node-RED applies the form. That native path updates dirty state,
            // history and the old/new config nodes' user associations together.
            if (CONTROLLER_CONFIG_NODE_FIELDS.has(key)) return;
            if (Object.prototype.hasOwnProperty.call(legacyContext, key)) {
              this[key] = cloneEditorValue(legacyContext[key]);
            }
          });
          if (Number.isFinite(Number(legacyContext.inputs))) this.inputs = Number(legacyContext.inputs);
          if (Number.isFinite(Number(legacyContext.outputs))) this.outputs = Number(legacyContext.outputs);
        }
        if (editorDraft) this.hueControllerType = selectedControllerType;
        if (typeof this._hueControllerCleanupDevice === 'function') this._hueControllerCleanupDevice();
        delete this._hueControllerCollectEditor;
        delete this._hueControllerGetEditorDraft;
        delete this._hueControllerGetActiveControllerType;
        delete this._hueControllerGetLegacyContext;
        delete this._hueControllerGetProfile;
        delete this._hueControllerCloseMigration;
        delete this._hueControllerRestoreOriginalState;
        delete this._hueControllerCleanupDevice;
      },
      oneditcancel() {
        // Cancel releases profile-owned editor state. The persisted node should
        // still match its opening snapshot because previews use an isolated
        // draft; restore the snapshot as a guard against indirect mutations.
        if (typeof this._hueControllerCloseMigration === 'function') this._hueControllerCloseMigration();
        const profile = typeof this._hueControllerGetProfile === 'function'
          ? this._hueControllerGetProfile()
          : undefined;
        const legacyContext = typeof this._hueControllerGetLegacyContext === 'function'
          ? this._hueControllerGetLegacyContext()
          : undefined;
        const activeControllerType = typeof this._hueControllerGetActiveControllerType === 'function'
          ? this._hueControllerGetActiveControllerType()
          : undefined;
        const definition = profile ? getProfileDefinition(activeControllerType || this.hueControllerType) : undefined;
        if (definition && typeof definition.oneditcancel === 'function') {
          definition.oneditcancel.call(legacyContext || this);
        }
        if (typeof this._hueControllerCleanupDevice === 'function') this._hueControllerCleanupDevice();
        if (typeof this._hueControllerRestoreOriginalState === 'function') this._hueControllerRestoreOriginalState();
        delete this._hueControllerCollectEditor;
        delete this._hueControllerGetEditorDraft;
        delete this._hueControllerGetActiveControllerType;
        delete this._hueControllerGetLegacyContext;
        delete this._hueControllerGetProfile;
        delete this._hueControllerCloseMigration;
        delete this._hueControllerRestoreOriginalState;
        delete this._hueControllerCleanupDevice;
      }
    });
  }());
</script>

<script type="text/markdown" data-help-name="hueUltimateController">
<!-- GENERATED by scripts/generate-hue-controller-help.js. -->

## HUE Controller

HUE Controller connects Philips Hue API v2 resources directly to Node-RED. It works as a standalone node: msg.topic selects a configured function and msg.payload carries the command or state value.

[HUE Ultimate video tutorials](https://www.youtube.com/playlist?list=PL9Yh1bjbLAYrU8PsVhW4xzEug2WtVFv3E)

## Quick start

1. Configure a Hue Bridge and add HUE Controller to the flow.
2. Select a Hue resource. Its function and available capabilities are detected automatically.
3. Leave the optional integration at none for a message-only flow.
4. Enable the input/output pins, assign exact command and state topics, then Deploy.

## Node-RED message mappings (default)

Each command or state field is a mapping. In the default mode, enter a topic name. Command topics consume msg.payload; state topics publish msg.payload. Topic matching is exact and wildcards are not supported.

```js
msg.topic = 'living-room/brightness'
msg.payload = 60
return msg
```

Use booleans for on/off, percentages for brightness, Kelvin for colour temperature and an object with red, green and blue properties for RGB. Relative dimming uses an object with decr_incr and data. Scene recall accepts the configured scene number, or a boolean for a single scene.

### Philips Hue API v2 input messages

For device functions with an input pin, you can also send a native Philips Hue API v2 command instead of using a topic/payload mapping. Put the API properties directly on msg, not inside msg.payload. For example, to switch on a light:

```js
msg = { on: { on: true } }
return msg
```

Send only properties supported by the selected Hue resource. The native command is forwarded to Hue as supplied.

## Optional KNX integration

Select a KNX Ultimate gateway only when this flow must exchange group-address telegrams. Mapping fields then accept group addresses or ETS names and show the applicable DPT selector. Clear the optional integration to return to Node-RED topics; no KNX package or gateway is required for message-based flows.

## Editor behaviour and diagnostics

- Saved mappings are rendered immediately, even while the Hue Bridge resource catalogue is still loading.
- For lights, Dim, Tunable White, RGB/HSV and native effects follow the live <code>dimming</code>, <code>color_temperature</code>, <code>color</code> and effects capabilities.
- A failed capability request never erases the saved configuration. Node-RED shows a dismissible error and keeps the editor usable.
- Changing the selected resource is only a preview until Save. Cancel restores the previous resource, function and mappings.

## Converting legacy HUE nodes

When legacy HUE nodes are present, the conversion action first downloads a local flow backup. It preserves node IDs, configuration references, positions and wiring, then leaves the result undeployed for review. Inspect every converted node before clicking Deploy.

[Watch the legacy HUE conversion video](https://youtu.be/f0Evf2QFI7c)

<span id="hue-controller-help-light" data-hue-controller-type="light"></span>

### Light / grouped light (`light`)

Controls a light or grouped light: on/off, relative and absolute brightness, colour temperature, RGB/HSV, effects and day/night behaviour.

<span id="hue-controller-help-plug" data-hue-controller-type="plug"></span>

### Plug / outlet (`plug`)

Controls a Hue plug and publishes its on/off and reported power state.

<span id="hue-controller-help-button" data-hue-controller-type="button"></span>

### Button (`button`)

Publishes short, long and repeat button events and can map them to switch or dim commands.

<span id="hue-controller-help-relative_rotary" data-hue-controller-type="relative_rotary"></span>

### Tap dial (`relative_rotary`)

Publishes Tap dial rotation events for relative or absolute level control.

<span id="hue-controller-help-motion" data-hue-controller-type="motion"></span>

### Motion (`motion`)

Publishes the detected/not detected state of a Hue motion sensor.

<span id="hue-controller-help-area_motion" data-hue-controller-type="area_motion"></span>

### Area motion (`area_motion`)

Publishes the aggregated motion state reported by a MotionAware area.

<span id="hue-controller-help-camera_motion" data-hue-controller-type="camera_motion"></span>

### Camera motion (`camera_motion`)

Publishes the motion state reported by a compatible Hue camera resource.

<span id="hue-controller-help-contact" data-hue-controller-type="contact"></span>

### Contact (`contact`)

Publishes the open/closed state of a Hue contact sensor.

<span id="hue-controller-help-light_level" data-hue-controller-type="light_level"></span>

### Light level (`light_level`)

Publishes ambient illuminance in lux.

<span id="hue-controller-help-temperature" data-hue-controller-type="temperature"></span>

### Temperature (`temperature`)

Publishes the measured temperature in degrees Celsius.

<span id="hue-controller-help-humidity" data-hue-controller-type="humidity"></span>

### Humidity (`humidity`)

Publishes relative humidity as a percentage.

<span id="hue-controller-help-scene" data-hue-controller-type="scene"></span>

### Scene (`scene`)

Recalls one Hue scene or maps incoming scene numbers to multiple scenes.

<span id="hue-controller-help-device_power" data-hue-controller-type="device_power"></span>

### Battery (`device_power`)

Publishes the battery level of a Hue device as a percentage.

<span id="hue-controller-help-zigbee_connectivity" data-hue-controller-type="zigbee_connectivity"></span>

### Zigbee connectivity (`zigbee_connectivity`)

Publishes the Zigbee connectivity state of a Hue device.

<span id="hue-controller-help-device_software_update" data-hue-controller-type="device_software_update"></span>

### Device software update (`device_software_update`)

Publishes whether a software update is available and its current update state.
